name: Build NuvPrivacity AAB

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-aab:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Preparar clave de firma
        env:
          KEYSTORE_B64: ${{ secrets.NUV_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NUV_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/nuvprivacity-upload.jks"
          test -s "$RUNNER_TEMP/nuvprivacity-upload.jks"

      - name: Compilar AAB release firmado
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/nuvprivacity-upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.NUV_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUV_KEY_PASSWORD }}
        run: |
          gradle :app:bundleRelease --stacktrace

      - name: Guardar AAB como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: NuvPrivacity-release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
